<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zone Isohypse</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f4f6f4; --panel: #ffffff; --fg: #1d2a22; --muted: #5d6b63; --line: #d5ddd7;
    --accent: #1f7a4d; --accent-fg: #ffffff; --warn: #a15c00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a16; --panel: #1b231e; --fg: #e6eee9; --muted: #98a79e; --line: #2f3b34;
      --accent: #4cc38a; --accent-fg: #0b1a12; --warn: #e0a24a; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  #panel {
    width: 340px; flex: none; overflow-y: auto; padding: 16px; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px;
  }
  #map { flex: 1; min-width: 0; }
  h1 { font-size: 17px; margin: 0; }
  p { margin: 0; color: var(--muted); }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  input, select, textarea, button {
    font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 9px;
  }
  textarea { width: 100%; height: 92px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  button { cursor: pointer; background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  button.plain { background: var(--bg); color: var(--fg); border-color: var(--line); font-weight: 400; }
  #info { font-variant-numeric: tabular-nums; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  #info dt { color: var(--muted); }
  #info dd { margin: 0; text-align: right; }
  #note { color: var(--warn); font-size: 12px; }
  @media (max-width: 720px) {
    body { flex-direction: column-reverse; }
    #panel { width: auto; max-height: 55%; border-right: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="panel">
  <h1>Zone de la carte</h1>
  <p>Clique sur la carte pour placer le centre, ou fais glisser le repère. Le carré a le côté demandé, en mètres réels.</p>

  <label>Chercher un lieu
    <div class="row">
      <input id="query" type="search" placeholder="Lucerne, Mont Blanc…">
      <button id="go" class="plain" style="flex:none">Aller</button>
    </div>
  </label>

  <div class="row">
    <label>Latitude <input id="lat" type="number" step="0.000001" value="46.953446"></label>
    <label>Longitude <input id="lon" type="number" step="0.000001" value="8.381618"></label>
  </div>
  <div class="row">
    <label>Côté du carré <input id="side" type="number" min="1" step="any" value="100"></label>
    <label>Unité
      <select id="unit"><option value="1000" selected>km</option><option value="1">m</option></select>
    </label>
  </div>

  <dl id="info">
    <dt>Côté</dt><dd id="i-side"></dd>
    <dt>Surface</dt><dd id="i-area"></dd>
    <dt>Échantillonnage</dt><dd id="i-step"></dd>
    <dt>Nord-ouest</dt><dd id="i-nw"></dd>
    <dt>Sud-est</dt><dd id="i-se"></dd>
  </dl>
  <p id="note" hidden></p>

  <label>À coller dans config.yml
    <textarea id="yaml" readonly></textarea>
  </label>
  <div class="row">
    <button id="copy">Copier</button>
    <button id="fit" class="plain">Cadrer le carré</button>
  </div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // The same geometry as HeightMapGenerator: a square of `side` metres centred on (lat, lon).
  const M_PER_DEG_LAT = 111320;
  const MAX_SAMPLES = 4096; // most samples per side of the real area (HeightMapGenerator)

  const $ = (id) => document.getElementById(id);
  const map = L.map('map', { zoomControl: true }).setView([46.953446, 8.381618], 8);
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: 'Esri World Imagery' });
  L.control.layers({ 'Plan': osm, 'Satellite': satellite }).addTo(map);
  L.control.scale({ metric: true, imperial: false }).addTo(map);

  const marker = L.marker([46.953446, 8.381618], { draggable: true }).addTo(map);
  const square = L.rectangle([[0, 0], [0, 0]], { color: '#1f7a4d', weight: 2, fillOpacity: 0.12 }).addTo(map);

  function sideMetres() {
    return Math.max(1, parseFloat($('side').value) * parseFloat($('unit').value) || 1);
  }

  function bounds(lat, lon, side) {
    const half = side / 2;
    const dLat = half / M_PER_DEG_LAT;
    const dLon = half / (M_PER_DEG_LAT * Math.cos(lat * Math.PI / 180));
    return { north: lat + dLat, south: lat - dLat, west: lon - dLon, east: lon + dLon };
  }

  const fmt = (n, d = 6) => n.toFixed(d);

  function update(fit) {
    const lat = parseFloat($('lat').value);
    const lon = parseFloat($('lon').value);
    if (!isFinite(lat) || !isFinite(lon)) { return; }
    const side = sideMetres();
    const b = bounds(lat, lon, side);
    marker.setLatLng([lat, lon]);
    square.setBounds([[b.south, b.west], [b.north, b.east]]);
    if (fit) { map.fitBounds(square.getBounds(), { padding: [30, 30] }); }

    const step = Math.max(1, Math.ceil(side / MAX_SAMPLES));
    const samples = Math.ceil(side / step);
    $('i-side').textContent = side >= 1000 ? (side / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 3 }) + ' km'
        : side.toLocaleString('fr-FR') + ' m';
    $('i-area').textContent = (side * side / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' km²';
    $('i-step').textContent = step === 1 ? '1 point par mètre' : '1 point tous les ' + step + ' m (' + samples + '×' + samples + ')';
    $('i-nw').textContent = fmt(b.north, 5) + ', ' + fmt(b.west, 5);
    $('i-se').textContent = fmt(b.south, 5) + ', ' + fmt(b.east, 5);

    const note = $('note');
    if (Math.abs(lat) > 85) { note.hidden = false; note.textContent = 'Le plugin refuse une latitude au-delà de ±85°.'; }
    else if (!Number.isInteger(side)) { note.hidden = false; note.textContent = 'La config attend un nombre entier de mètres : ' + Math.round(side) + ' sera utilisé.'; }
    else { note.hidden = true; }

    $('yaml').value = 'realistic:\n  latitude: ' + fmt(lat) + '\n  longitude: ' + fmt(lon) + '\n  size: ' + Math.round(side);
  }

  map.on('click', (e) => {
    $('lat').value = fmt(e.latlng.lat);
    $('lon').value = fmt(e.latlng.lng);
    update(false);
  });
  marker.on('dragend', () => {
    const p = marker.getLatLng();
    $('lat').value = fmt(p.lat);
    $('lon').value = fmt(p.lng);
    update(false);
  });
  for (const id of ['lat', 'lon', 'side', 'unit']) { $(id).addEventListener('input', () => update(false)); }
  $('fit').addEventListener('click', () => update(true));

  $('copy').addEventListener('click', async () => {
    const area = $('yaml');
    try { await navigator.clipboard.writeText(area.value); $('copy').textContent = 'Copié'; }
    catch (e) { area.select(); document.execCommand('copy'); $('copy').textContent = 'Copié'; }
    setTimeout(() => { $('copy').textContent = 'Copier'; }, 1500);
  });

  async function search() {
    const q = $('query').value.trim();
    if (!q) { return; }
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
      const found = await r.json();
      if (found.length) {
        $('lat').value = fmt(parseFloat(found[0].lat));
        $('lon').value = fmt(parseFloat(found[0].lon));
        update(true);
      } else { $('note').hidden = false; $('note').textContent = 'Aucun lieu trouvé pour « ' + q + ' ».'; }
    } catch (e) { $('note').hidden = false; $('note').textContent = 'La recherche n\'a pas abouti : ' + e.message; }
  }
  $('go').addEventListener('click', search);
  $('query').addEventListener('keydown', (e) => { if (e.key === 'Enter') { search(); } });

  update(false);
  // the map only knows its size once the page is laid out: frame the square then
  window.addEventListener('load', () => { map.invalidateSize(); update(true); });
  window.addEventListener('resize', () => map.invalidateSize());
</script>
</body>
</html>
