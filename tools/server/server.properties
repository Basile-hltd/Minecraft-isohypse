# Réglages de server.properties appliqués par local_run.py à chaque démarrage (ils écrasent ceux du serveur).
# Seules les clés listées ici sont modifiées ; les autres gardent la valeur de Paper.
# Serveur de test local uniquement : ne pas réutiliser ces réglages pour un vrai serveur.
white-list=false
enforce-whitelist=false
gamemode=spectator
online-mode=false

# Style de génération : Vanilla+, Realistic, Fairy (autre valeur : génération vanilla, sans le générateur du plugin)
level-type=Realistic

# Seed du monde. Vide = aléatoire (affichée au démarrage). Ne s'applique qu'à un monde neuf (--clean).
level-seed=1
